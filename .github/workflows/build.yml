name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest   # repo cá nhân trên GitHub.com, dùng runner public
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: racing
          MYSQL_USER: racing
          MYSQL_PASSWORD: racing
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Healthcheck của image MySQL đi qua socket và có thể "healthy" khi entrypoint còn đang
      # khởi tạo (server tạm chưa nghe TCP), nên phải chờ kết nối TCP thật sự trước khi nạp schema.
      - name: Wait for MySQL over TCP
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL ready after $i attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "MySQL not reachable over TCP after 60 s"; exit 1
      - name: Load schema and seed
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot < db/schema.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot racing < db/seed.sql
      - name: Build and test (unit + DAO integration)
        env:
          RACING_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/racing
          RACING_TEST_DB_USER: racing
          RACING_TEST_DB_PASSWORD: racing
        run: ./mvnw -B -ntp package
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            server/target/racing-server.jar
            client/target/racing-client.jar
            tools/target/racing-tools.jar
          if-no-files-found: ignore
