name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest   # repo cá nhân trên GitHub.com, dùng runner public
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: racing
          MYSQL_USER: racing
          MYSQL_PASSWORD: racing
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Load schema and seed
        run: |
          mysql -h 127.0.0.1 -uroot -proot < db/schema.sql
          mysql -h 127.0.0.1 -uroot -proot racing < db/seed.sql
      - name: Build and test (unit + DAO integration)
        env:
          RACING_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/racing
          RACING_TEST_DB_USER: racing
          RACING_TEST_DB_PASSWORD: racing
        run: ./mvnw -B -ntp package
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            server/target/racing-server.jar
            client/target/racing-client.jar
          if-no-files-found: ignore
